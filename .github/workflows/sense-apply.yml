name: Apply Stremio Sense Core MVP
on:
  push:
    branches: [sense-mvp]
permissions:
  contents: write
jobs:
  apply-test:
    if: github.event.head_commit.message == 'Apply Stremio Sense Core MVP'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply Sense model
        run: python .sense/apply.py .
      - name: Declare Intelligence serializer module
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('stremio-core-web/src/lib.rs')
          s = p.read_text()
          needle = '    pub mod serialize_installed_addons;\n'
          addition = needle + '    pub mod serialize_intelligence;\n'
          if 'pub mod serialize_intelligence;' not in s:
              if needle not in s:
                  raise SystemExit('serializer module anchor changed')
              s = s.replace(needle, addition, 1)
              p.write_text(s)
          PY
      - name: Remove patch kit
        run: rm -rf .sense .github/workflows/sense-apply.yml
      - name: Format
        run: cargo fmt --all
      - name: Test workspace
        run: cargo test --workspace
      - name: Commit validated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Stremio Sense Intelligence model'
          git push origin HEAD:sense-mvp
